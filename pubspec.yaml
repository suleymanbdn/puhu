name: puhu
description: "Puhu — YKS çalışma asistanın. Konu takibi, soru çözüm, deneme analizi, akıllı tekrar."
publish_to: 'none'
version: 1.1.2+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management - Riverpod
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  
  # Navigation
  go_router: ^14.2.7
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.2
  
  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  table_calendar: ^3.1.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  in_app_update: ^4.2.5
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  fl_chart: ^1.2.0

  # In-App Purchases - RevenueCat
  purchases_flutter: ^8.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  
  # App Icon Generator
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#1E1B4B"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E1B4B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: false

flutter:
  uses-material-design: true

